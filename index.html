<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Фабрика Грёз — симулятор киностудии</title>
    <!-- An inline favicon: no extra request, no 404 on static hosts, works offline. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E" >
    <script src="libs/simplex-noise.js?v=1.0.0"></script>
    <script src="libs/playcanvas.min.js?v=1.0.0"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            background: #222;
            z-index: 1000;
        }
        .loading-text {
            font: 14px system-ui, sans-serif;
            color: #c8d0d8;
            text-align: center;
            min-height: 1em;
        }
        .loading-bar {
            width: min(220px, 70vw);
            height: 10px;
            background: #444;
            border-radius: 5px;
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            width: 0%;
            background: #7cc0c7;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <canvas id="world3d"></canvas>
    <div id="loading-screen">
        <div class="loading-bar"><div class="loading-progress"></div></div>
        <div class="loading-text"></div>
    </div>

    <!-- Order matters: Constants.js first (the others read its globals), main.js last -->
    <script src="js/Constants.js?v=1.0.0"></script>
    <script src="js/Objects.js?v=1.0.0"></script>
    <script src="js/UILayout.js?v=1.0.0"></script>
    <!-- engine (PlayArcEngine UVP generation) -->
    <script src="js/engine/Sound3D.js?v=1.0.0"></script>
    <script src="js/engine/World3D.js?v=1.0.0"></script>
    <script src="js/engine/Terrain3D.js?v=1.0.0"></script>
    <script src="js/engine/CameraControl.js?v=1.0.0"></script>
    <script src="js/engine/Model3D.js?v=1.0.0"></script>
    <script src="js/engine/Gltf3D.js?v=1.0.0"></script>
    <script src="js/engine/Location3D.js?v=1.0.0"></script>
    <script src="js/engine/Procedural3D.js?v=1.0.0"></script>
    <script src="js/engine/Debug3D.js?v=1.0.0"></script>
    <script src="js/engine/Sprite2D.js?v=1.0.0"></script>
    <script src="js/engine/Camera3D.js?v=1.0.0"></script>
    <script src="js/engine/Lighting3D.js?v=1.0.0"></script>
    <script src="js/engine/Visual3D.js?v=1.0.0"></script>
    <!-- core: the semantic world/model contracts -->
    <script src="js/core/Coords.js?v=1.0.0"></script>
    <script src="js/core/Entity.js?v=1.0.0"></script>
    <script src="js/core/World.js?v=1.0.0"></script>
    <script src="js/core/GameModel.js?v=1.0.0"></script>
    <script src="js/core/Input.js?v=1.0.0"></script>
    <script src="js/core/GameAudio.js?v=1.0.0"></script>
    <script src="js/core/Save.js?v=1.0.0"></script>
    <script src="js/SceneSchema.js?v=1.0.0"></script>
    <!-- presentation: the pipeline bridge (runtime boots in a later ROADMAP phase) -->
    <script src="js/presentation/RenderProfiles.js?v=1.0.0"></script>
    <script src="js/presentation/AssetRegistry.js?v=1.0.0"></script>
    <script src="js/presentation/Variant.js?v=1.0.0"></script>
    <script src="js/presentation/RenderProfile.js?v=1.0.0"></script>
    <script src="js/presentation/Camera.js?v=1.0.0"></script>
    <script src="js/presentation/Lighting.js?v=1.0.0"></script>
    <script src="js/presentation/Animation.js?v=1.0.0"></script>
    <script src="js/presentation/VisualEntity.js?v=1.0.0"></script>
    <script src="js/presentation/Migration.js?v=1.0.0"></script>
    <script src="js/presentation/Runtime.js?v=1.0.0"></script>
    <script src="js/profiles/2d/profile.js?v=1.0.0"></script>
    <script src="js/profiles/2.5d/profile.js?v=1.0.0"></script>
    <script src="js/profiles/isometric3d/profile.js?v=1.0.0"></script>
    <script src="js/profiles/lowpoly3d/profile.js?v=1.0.0"></script>
    <script src="js/profiles/full3d/profile.js?v=1.0.0"></script>
    <!-- UI + the game's semantic scene API -->
    <script src="js/UI.js?v=1.0.0"></script>
    <script src="js/UiCss.js?v=1.0.0"></script>
    <script src="js/SceneAPI.js?v=1.0.0"></script>
    <!-- the studio simulator: engine-layer modules, then systems, then the game -->
    <script src="js/Rng.js?v=1.0.0"></script>
    <script src="js/MovieData.js?v=1.0.0"></script>
    <script src="js/ActorModels.js?v=1.0.0"></script>
    <script src="js/ActorRig3D.js?v=1.0.0"></script>
    <script src="js/SetPieces3D.js?v=1.0.0"></script>
    <script src="js/CineCam3D.js?v=1.0.0"></script>
    <script src="js/CinePost3D.js?v=1.0.0"></script>
    <script src="js/Sky3D.js?v=1.0.0"></script>
    <script src="js/Particles3D.js?v=1.0.0"></script>
    <script src="js/PeopleSystem.js?v=1.0.0"></script>
    <script src="js/StudioManager.js?v=1.0.0"></script>
    <script src="js/ScriptGenerator.js?v=1.0.0"></script>
    <script src="js/CastingSystem.js?v=1.0.0"></script>
    <script src="js/ProductionSystem.js?v=1.0.0"></script>
    <script src="js/ReleaseSystem.js?v=1.0.0"></script>
    <script src="js/MetaSystem.js?v=1.0.0"></script>
    <script src="js/SaveSystem.js?v=1.0.0"></script>
    <script src="js/Tutorial.js?v=1.0.0"></script>
    <script src="js/StudioUI.js?v=1.0.0"></script>
    <script src="js/MovieSequencer.js?v=1.0.0"></script>
    <script src="js/Game.js?v=1.0.0"></script>
    <script src="js/main.js?v=1.0.0"></script>
    <script>
        // A long tap and RMB must not open the browser menu.
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
